services:
  - type: web
    name: aquasentinel-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: aquasentinel-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://aquasentinel-ai.vercel.app

databases:
  - name: aquasentinel-db
    databaseName: aquasentinel
    user: aquasentinel
    plan: free

